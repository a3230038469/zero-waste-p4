<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 零：环形轮廓 -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#2A6045" stroke-width="6"/>
  <!-- 六尺巷：竖线由长到短向中间收拢，中间留白让出三尺 -->
