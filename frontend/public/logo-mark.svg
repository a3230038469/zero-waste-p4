    <rect x="33" y="44" width="6" height="112"/>
    <rect x="49" y="54" width="6" height="92"/>
    <rect x="65" y="64" width="6" height="72"/>
    <rect x="81" y="76" width="6" height="48"/>
    <rect x="113" y="76" width="6" height="48"/>
    <rect x="129" y="64" width="6" height="72"/>
    <rect x="145" y="54" width="6" height="92"/>
    <rect x="161" y="44" width="6" height="112"/>
  </g>
</svg>
