body{margin:0;background:#F4F1EA;font-family:sans-serif;padding:32px;color:#1C1C1A}

.card{background:#F4F1EA;border-bottom:1px solid #D8D3C6;padding:16px 0;}

<div class="rev"><img src="logo-horizontal-reverse.svg" height="96"></div>

<div class="small">
<img src="logo-mark.svg" width="32" height="32">
